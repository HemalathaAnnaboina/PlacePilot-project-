# ===================================================================
# Development Profile (Zero-friction local dev with PostgreSQL mode)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:placepilot;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console for rapid debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Dev JWT Secret (Isolated local secret; overridden by JWT_SECRET if provided)
placepilot.jwt.secret=${JWT_SECRET:PlacePilotLocalDevelopmentSecretKeyWithAtLeast256BitsLengthForHMACSHA256Security}

