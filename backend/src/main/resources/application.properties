# ===================================================================
# PlacePilot Application Configuration
# ===================================================================
spring.application.name=placepilot-backend
server.port=${PORT:8080}

# Active Profile: dev (H2 in PostgreSQL compatibility mode) or prod (PostgreSQL)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration (Injected via environment variable; dev fallback in application-dev.properties)
placepilot.jwt.secret=${JWT_SECRET:}
placepilot.jwt.expiration-ms=86400000

# AI Configuration (Optional External LLM API Key: Gemini or OpenAI)
placepilot.ai.api-key=${AI_API_KEY:}
placepilot.ai.model=${AI_MODEL:gemini-1.5-pro}

# OpenAPI / Swagger Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

